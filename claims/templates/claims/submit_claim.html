
<!DOCTYPE html>
<html>
<head>
    <title>Submit Claim</title>
</head>
<body>

    <h1>Claim Found Item</h1>

    <h3>Found Item: {{ item.name }}</h3>

    <p>Select the LOST report that matches this found item.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Continue to Verification</button>
    </form>

    <a href="{% url 'browse_items' %}">Cancel</a>

</body>
</html>
